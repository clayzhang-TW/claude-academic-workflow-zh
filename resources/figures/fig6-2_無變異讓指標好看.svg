<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" width="560" height="720" font-family="Noto Sans TC, Microsoft JhengHei, Helvetica, Arial, sans-serif">
  <style>
    @page{size:560px 720px;margin:0}
    .bg{fill:#faf7f0}
    .ink{fill:#23201b}
    .muted{fill:#6b6459}
    .rule{stroke:#ddd5c6;stroke-width:1}
    .panel{fill:#f2ede2;stroke:#ddd5c6;stroke-width:1}
    .panelbad{fill:#f6eaec;stroke:#8a2b3f;stroke-width:1.8}
    .dot{fill:#8a5a2b}
    .dotbad{fill:#8a2b3f}
    .fitline{stroke:#6b6459;stroke-width:1.6;fill:none}
    .arrow{stroke:#8a5a2b;stroke-width:1.6;fill:none}
    .fitlinebad{stroke:#8a2b3f;stroke-width:1.6;fill:none}
    .resid{stroke:#8a5a2b;stroke-width:1.4;stroke-dasharray:3 2}
    .warn{fill:#8a2b3f}
    .head{fill:#8a5a2b}
    .colrule{stroke:#c9bfab;stroke-width:1;stroke-dasharray:3 3}
    .title{font-size:17px;font-weight:700}
    .h{font-size:14px;font-weight:700}
    .b{font-size:13px;font-weight:700}
    .s{font-size:12px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#17150f}.ink{fill:#ece5d6}.muted{fill:#a49a88}.rule{stroke:#3a352a}
      .panel{fill:#1e1a13;stroke:#3a352a}.panelbad{fill:#2a1a1f;stroke:#e08a9c}
      .dot{fill:#d09a5e}.dotbad{fill:#e08a9c}
      .fitline{stroke:#a49a88}.fitlinebad{stroke:#e08a9c}.arrow{stroke:#d09a5e}
      .resid{stroke:#d09a5e}
      .warn{fill:#e08a9c}.head{fill:#d09a5e}.colrule{stroke:#4a4335}
    }
  </style>

  <rect class="bg" width="560" height="720"/>
  <text class="ink title" x="18" y="28">圖 6-2　為什麼「配適變好」有時候是壞消息</text>
  <text class="muted s" x="18" y="50">上下兩排是同一個機制的兩個場合。要看的是點的排法，不是數字。（示意，非真實資料）</text>

  <defs>
    <marker id="m64" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- ===== 上排：試題分析 ===== -->
  <text class="ink h" x="18" y="82">場合一　試題分析：一道題目</text>

  <!-- 面板 A：有鑑別度 -->
  <rect class="panel" x="18" y="94" width="258" height="196" rx="6"/>
  <text class="ink b" x="147" y="116" text-anchor="middle">有鑑別度的題目</text>
  <line class="colrule" x1="158" y1="126" x2="158" y2="262"/>
  <text class="muted s" x="120" y="144" text-anchor="middle">答錯</text>
  <text class="muted s" x="211" y="144" text-anchor="middle">答對</text>
  <text class="muted s" x="30" y="176">高分組</text>
  <text class="muted s" x="30" y="236">低分組</text>

  <circle class="dot" cx="120" cy="172" r="4"/>
  <circle class="dot" cx="183" cy="172" r="4"/>
  <circle class="dot" cx="197" cy="172" r="4"/>
  <circle class="dot" cx="211" cy="172" r="4"/>
  <circle class="dot" cx="225" cy="172" r="4"/>
  <circle class="dot" cx="239" cy="172" r="4"/>

  <circle class="dot" cx="99" cy="232" r="4"/>
  <circle class="dot" cx="113" cy="232" r="4"/>
  <circle class="dot" cx="127" cy="232" r="4"/>
  <circle class="dot" cx="141" cy="232" r="4"/>
  <circle class="dot" cx="204" cy="232" r="4"/>
  <circle class="dot" cx="218" cy="232" r="4"/>

  <line class="rule" x1="30" y1="256" x2="264" y2="256"/>
  <text class="muted s" x="30" y="276">兩列分得開　→　它在測東西</text>

  <!-- 面板 B：全對 -->
  <rect class="panelbad" x="284" y="94" width="258" height="196" rx="6"/>
  <text class="warn b" x="413" y="116" text-anchor="middle">所有人都答對的題目</text>
  <line class="colrule" x1="424" y1="126" x2="424" y2="262"/>
  <text class="muted s" x="386" y="144" text-anchor="middle">答錯</text>
  <text class="muted s" x="477" y="144" text-anchor="middle">答對</text>
  <text class="muted s" x="296" y="176">高分組</text>
  <text class="muted s" x="296" y="236">低分組</text>

  <circle class="dotbad" cx="442" cy="172" r="4"/>
  <circle class="dotbad" cx="456" cy="172" r="4"/>
  <circle class="dotbad" cx="470" cy="172" r="4"/>
  <circle class="dotbad" cx="484" cy="172" r="4"/>
  <circle class="dotbad" cx="498" cy="172" r="4"/>
  <circle class="dotbad" cx="512" cy="172" r="4"/>

  <circle class="dotbad" cx="442" cy="232" r="4"/>
  <circle class="dotbad" cx="456" cy="232" r="4"/>
  <circle class="dotbad" cx="470" cy="232" r="4"/>
  <circle class="dotbad" cx="484" cy="232" r="4"/>
  <circle class="dotbad" cx="498" cy="232" r="4"/>
  <circle class="dotbad" cx="512" cy="232" r="4"/>

  <line class="rule" x1="296" y1="256" x2="530" y2="256"/>
  <text class="warn s" x="296" y="276" font-weight="700">通過率 1.00，鑑別度 0.00</text>

  <!-- ===== 中間：同一個機制 ===== -->
  <path class="arrow" d="M147,290 V318" marker-end="url(#m64)"/>
  <path class="fitlinebad" d="M413,290 V318" marker-end="url(#m64)"/>
  <text class="head b" x="280" y="312" text-anchor="middle">同一個機制</text>

  <!-- ===== 下排：混合模型 ===== -->
  <text class="ink h" x="18" y="348">場合二　混合模型：一個潛在組</text>

  <!-- 面板 C：正常組 -->
  <rect class="panel" x="18" y="360" width="258" height="212" rx="6"/>
  <text class="ink b" x="147" y="382" text-anchor="middle">一個正常的組</text>
  <text class="muted s" x="30" y="402">虛線＝殘差，點離線越遠殘差越大</text>

  <line class="fitline" x1="42" y1="546" x2="252" y2="418"/>
  <line class="resid" x1="70" y1="529" x2="70" y2="512"/>
  <circle class="dot" cx="70" cy="512" r="4"/>
  <line class="resid" x1="100" y1="511" x2="100" y2="490"/>
  <circle class="dot" cx="100" cy="490" r="4"/>
  <line class="resid" x1="130" y1="492" x2="130" y2="508"/>
  <circle class="dot" cx="130" cy="508" r="4"/>
  <line class="resid" x1="160" y1="474" x2="160" y2="462"/>
  <circle class="dot" cx="160" cy="462" r="4"/>
  <line class="resid" x1="190" y1="456" x2="190" y2="472"/>
  <circle class="dot" cx="190" cy="472" r="4"/>
  <line class="resid" x1="220" y1="437" x2="220" y2="428"/>
  <circle class="dot" cx="220" cy="428" r="4"/>

  <line class="rule" x1="30" y1="538" x2="264" y2="538"/>
  <text class="muted s" x="30" y="558">殘差有大有小　→　有東西要被解釋</text>

  <!-- 面板 D：退化解 -->
  <rect class="panelbad" x="284" y="360" width="258" height="212" rx="6"/>
  <text class="warn b" x="413" y="382" text-anchor="middle">殘差趨近零的那一組</text>
  <text class="muted s" x="296" y="402">點全部貼在線上，沒有虛線可畫</text>

  <line class="fitlinebad" x1="308" y1="546" x2="518" y2="418"/>
  <circle class="dotbad" cx="336" cy="529" r="4"/>
  <circle class="dotbad" cx="366" cy="511" r="4"/>
  <circle class="dotbad" cx="396" cy="492" r="4"/>
  <circle class="dotbad" cx="426" cy="474" r="4"/>
  <circle class="dotbad" cx="456" cy="456" r="4"/>
  <circle class="dotbad" cx="486" cy="437" r="4"/>

  <line class="rule" x1="296" y1="538" x2="530" y2="538"/>
  <text class="warn s" x="296" y="558" font-weight="700">配適指標：更好</text>

  <!-- ===== 結論 ===== -->
  <line class="rule" x1="18" y1="596" x2="542" y2="596"/>
  <text class="warn b" x="18" y="620">右邊那兩欄，指標都是最好看的那一個。</text>
  <text class="ink s" x="18" y="644" font-weight="700">而它們的共同點是：裡面的東西沒有被分開過。</text>
  <text class="muted s" x="18" y="668">全對的題目分不開高分組與低分組；殘差趨近零的組，不含任何需要被解釋的變異。</text>
  <text class="muted s" x="18" y="690">兩者都不會報錯。你收到的唯一訊號，就是那個變好看的數字。</text>
  <text class="head s" x="18" y="712" font-weight="700">判準跟 6.1 同一句：如果它做錯了，我看得出來嗎？</text>
</svg>
