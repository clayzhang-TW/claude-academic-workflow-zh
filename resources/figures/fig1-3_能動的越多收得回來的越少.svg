<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="Noto Sans TC, Microsoft JhengHei, Helvetica, Arial, sans-serif">
  <style>
    @page{size:560px 440px;margin:0}
    .bg{fill:#faf7f0}
    .ink{fill:#23201b}
    .muted{fill:#6b6459}
    .rule{stroke:#ddd5c6;stroke-width:1}
    .grid{stroke:#e6dfd0;stroke-width:1}
    .axis{stroke:#c9bfab;stroke-width:1.6}
    .power{stroke:#8a5a2b;stroke-width:2.4;fill:none;stroke-linejoin:round}
    .undo{stroke:#2f6b4f;stroke-width:2.4;fill:none;stroke-linejoin:round}
    .dotp{fill:#8a5a2b}
    .dotu{fill:#2f6b4f}
    .cross{fill:none;stroke:#8a2b3f;stroke-width:1.6;stroke-dasharray:4 3}
    .key{fill:#2f6b4f}
    .warn{fill:#8a2b3f}
    .head{fill:#8a5a2b}
    .title{font-size:17px;font-weight:700}
    .b{font-size:13px;font-weight:700}
    .s{font-size:12px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#17150f}.ink{fill:#ece5d6}.muted{fill:#a49a88}.rule{stroke:#3a352a}
      .grid{stroke:#2a2620}.axis{stroke:#4a4335}
      .power{stroke:#d09a5e}.undo{stroke:#7fc4a0}
      .dotp{fill:#d09a5e}.dotu{fill:#7fc4a0}
      .cross{stroke:#e08a9c}
      .key{fill:#7fc4a0}.warn{fill:#e08a9c}.head{fill:#d09a5e}
    }
  </style>

  <rect class="bg" width="560" height="440"/>
  <text class="ink title" x="18" y="28">圖 1-3　往右一格，它能動的變多，你能收回的變少</text>
  <text class="muted s" x="18" y="50">兩條線反向走。它們交叉的地方，就是你要開始想清楚才動手的地方。</text>

  <!-- 圖例 -->
  <line class="power" x1="18" y1="70" x2="44" y2="70"/>
  <text class="head s" x="50" y="74">它能動的範圍</text>
  <line class="undo" x1="170" y1="70" x2="196" y2="70"/>
  <text class="key s" x="202" y="74">出事之後你收得回來的程度</text>

  <!-- 格線與軸 -->
  <line class="grid" x1="60" y1="110" x2="540" y2="110"/>
  <line class="grid" x1="60" y1="290" x2="540" y2="290"/>
  <line class="axis" x1="60" y1="310" x2="540" y2="310"/>

  <!-- 能動的範圍：往右上（階梯，全部水平／垂直） -->
  <path class="power" d="M75,265 H150 V225 H250 V180 H370 V138 H525"/>
  <circle class="dotp" cx="95" cy="265" r="5"/>
  <circle class="dotp" cx="205" cy="225" r="5"/>
  <circle class="dotp" cx="315" cy="180" r="5"/>
  <circle class="dotp" cx="425" cy="138" r="5"/>

  <!-- 收得回來：往右下（階梯，垂直段錯開避免與上線交疊） -->
  <path class="undo" d="M75,140 H160 V182 H270 V228 H380 V270 H525"/>
  <circle class="dotu" cx="95" cy="140" r="5"/>
  <circle class="dotu" cx="205" cy="182" r="5"/>
  <circle class="dotu" cx="315" cy="228" r="5"/>
  <circle class="dotu" cx="425" cy="270" r="5"/>

  <!-- 交叉帶 -->
  <line class="cross" x1="260" y1="104" x2="260" y2="316"/>
  <text class="warn s" x="266" y="120" font-weight="700">從這裡開始，它動的是</text>
  <text class="warn s" x="266" y="136" font-weight="700">你真實的檔案</text>

  <!-- 四個入口 -->
  <text class="ink b" x="95" y="332" text-anchor="middle">Chat</text>
  <text class="muted s" x="95" y="352" text-anchor="middle">只回文字</text>
  <text class="muted s" x="95" y="370" text-anchor="middle">關掉重來</text>

  <text class="ink b" x="205" y="332" text-anchor="middle">Projects</text>
  <text class="muted s" x="205" y="352" text-anchor="middle">＋你上傳的檔</text>
  <text class="muted s" x="205" y="370" text-anchor="middle">＋跨次記憶</text>

  <text class="ink b" x="315" y="332" text-anchor="middle">Cowork</text>
  <text class="muted s" x="315" y="352" text-anchor="middle">讀寫你電腦</text>
  <text class="muted s" x="315" y="370" text-anchor="middle">上的檔案</text>

  <text class="ink b" x="425" y="332" text-anchor="middle">Code</text>
  <text class="muted s" x="425" y="352" text-anchor="middle">＋程式會</text>
  <text class="muted s" x="425" y="370" text-anchor="middle">真的跑起來</text>

  <!-- 底部 -->
  <line class="rule" x1="18" y1="392" x2="542" y2="392"/>
  <text class="ink b" x="18" y="414">後面跑的是同一個模型。差別不在它多聰明，在它碰得到什麼。</text>
  <text class="warn s" x="18" y="434" font-weight="700">所以「自動化程度高」不等於「比較高級」，等於「出事的傷害範圍比較大」。</text>
</svg>
